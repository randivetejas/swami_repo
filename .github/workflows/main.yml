name: First Overview

on:
  push:
    branches:
      - main

jobs:
  print-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/setup-python@v4
        with:
          python-version: 3.8
      - name: install dependencies
        run: pip install -r requirements.txt
      - name: Run extract.py
        run: python extract.py  

      - name: Print message
        run: echo "Hello, this is the first overview of the workflow!"

      - name: Print file content
        run: cat swami.txt
